<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="switch.css" />
    <link rel="stylesheet" href="spinner.css" />
    <script type="module" src="scripts.js" defer></script>
    <script type="module" src="locale.js" defer></script>
  </head>
  <body>
    <form name="switch" class="row switch-form">
      <template>
        <div>
          <input id="switch" type="checkbox" name="switch-control" hidden />
          <label class="switch-label" for="switch"></label>
        </div>
      </template>
      <div class="version">
        <span data-t="version"></span>: <span id="version"></span>
      </div>
    </form>
    <hr />
    <form name="main">
      <div class="row">
        <label for="lang"><span data-t="language.label"></span>: </label>
        <select name="lang" id="language">
          <option value="ru">Русский</option>
          <option value="en" selected>English</option>
          <option value="ro">Română</option>
          <option value="uk">Українська</option>
        </select>
      </div>
      <div class="row">
        <label for="currency"><span data-t="currency.label"></span>: </label>
        <select name="currency" id="currency">
          <option value="RUP" data-t="currency.options.rup"></option>
          <option value="USD" data-t="currency.options.usd"></option>
          <option value="EUR" data-t="currency.options.eur"></option>
          <option value="MDL" data-t="currency.options.mdl"></option>
        </select>
      </div>
      <div class="row">
        <label for="original-price"
          ><span data-t="original_price"></span>:
        </label>
        <input id="original-price" type="checkbox" name="original-price" />
      </div>
    </form>
    <div>
      <hr />
      <h4 class="heading" data-t="rates.label"></h4>
      <div class="exc" id="exc-table"></div>
    </div>
  </body>
</html>
